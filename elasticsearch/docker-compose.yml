services:
  elasticsearch:
    build:
      context: .
    image: project-agora-elasticsearch:8.19.22-nori
    container_name: agora-elasticsearch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ES_HTTP_TLS_ENABLED=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.supported_protocols=TLSv1.3
      - xpack.security.http.ssl.certificate=${ES_TLS_CERTIFICATE:-/usr/share/elasticsearch/config/certs/http.crt}
      - xpack.security.http.ssl.key=${ES_TLS_KEY:-/usr/share/elasticsearch/config/certs/http.key}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      - ES_INDEX=${ES_INDEX:-canvas}
      - ES_USER_NAME=${ES_USER_NAME:-agora_user}
      - ES_USER_PASSWORD=${ES_USER_PASSWORD:?ES_USER_PASSWORD is required}
      - "ES_JAVA_OPTS=-Xms${ES_JAVA_MIN_MEM:-1g} -Xmx${ES_JAVA_MAX_MEM:-2g}"
      - TZ=${TIMEZONE:-Asia/Seoul}
      - path.repo=/usr/share/elasticsearch/snapshots
    ports:
      # 외부 접속 바인딩 (.env의 ES_EXTERNAL_IP, ES_EXTERNAL_PORT 설정 반영)
      - "${ES_EXTERNAL_IP:-127.0.0.1}:${ES_EXTERNAL_PORT:-${ES_PORT:-9200}}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ${ES_SNAPSHOT_HOST_DIR:-./snapshots}:/usr/share/elasticsearch/snapshots
      - es_tls:/usr/share/elasticsearch/config/certs:ro
      - ./search/synonyms.txt:/usr/share/elasticsearch/config/analysis/canvas-synonyms.txt:ro
      - ./curl-auth.sh:/usr/local/bin/curl-auth.sh:ro
      - ./healthcheck.sh:/usr/local/bin/elasticsearch-healthcheck.sh:ro
    depends_on:
      elasticsearch-tls-init:
        condition: service_completed_successfully
    networks:
      - agora-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "/bin/bash", "/usr/local/bin/elasticsearch-healthcheck.sh" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  elasticsearch-tls-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    user: "0:0"
    restart: "no"
    network_mode: none
    environment:
      ES_HTTP_TLS_ENABLED: true
    volumes:
      - type: bind
        source: ${ES_TLS_CERTS_DIR:-./certs}
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - es_tls:/target
      - ./prepare-tls-volume.sh:/usr/local/bin/prepare-tls-volume.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/prepare-tls-volume.sh"]

volumes:
  es_tls:
    name: agora-elasticsearch-tls
  es_data:

networks:
  agora-net:
    name: agora-net
    ipam:
      config:
        - subnet: ${AGORA_NET_SUBNET:-172.21.0.0/16}
