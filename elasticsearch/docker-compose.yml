services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: agora-elasticsearch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-AgoraElasticSecret@Passw0rd!2026}
      - ES_INDEX=${ES_INDEX:-canvas}
      - ES_USER_NAME=${ES_USER_NAME:-agora_user}
      - ES_USER_PASSWORD=${ES_USER_PASSWORD:-AgoraUserSecret@Passw0rd!2026}
      - "ES_JAVA_OPTS=-Xms${ES_JAVA_MIN_MEM:-1g} -Xmx${ES_JAVA_MAX_MEM:-2g}"
      - TZ=${TIMEZONE:-Asia/Seoul}
    ports:
      # 외부 직접 노출 방지: 127.0.0.1 바인딩
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - agora-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD:-AgoraElasticSecret@Passw0rd!2026} -s -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  es_data:

networks:
  agora-net:
    name: agora-net
