services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: agora-redis-stack
    restart: unless-stopped
    env_file:
      - .env
    command: [ "redis-stack-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--protected-mode", "yes" ]
    environment:
      - REDIS_USER=${REDIS_USER:-agora_user}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD:?REDIS_USER_PASSWORD is required}
      - REDIS_INDEX_NAME=${REDIS_INDEX_NAME:-idx:canvas}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-canvas:}
      - TZ=${TIMEZONE:-Asia/Seoul}
    ports:
      # 호스트 포트 바인딩 (.env의 REDIS_BIND_IP, REDIS_EXTERNAL_PORT 설정 반영)
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_EXTERNAL_PORT:-${REDIS_PORT:-6379}}:6379"
      - "${REDIS_INSIGHT_BIND_IP:-127.0.0.1}:${REDIS_INSIGHT_PORT:-8001}:8001"
    volumes:
      - redis_data:/data
    networks:
      - agora-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH='$${REDIS_PASSWORD}' redis-cli ping | grep PONG || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  agora-net:
    name: agora-net
