services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: agora-redis-stack
    restart: unless-stopped
    env_file:
      - .env
    command: [ "redis-stack-server", "--requirepass", "${REDIS_PASSWORD:-AgoraRedisSecret@Passw0rd!2026}", "--protected-mode", "no" ]
    environment:
      - TZ=${TIMEZONE:-Asia/Seoul}
    ports:
      # 외부 요청 허용: 모든 네트워크 인터페이스(0.0.0.0)에서 접속 허용
      - "${REDIS_PORT:-6379}:6379"
      - "${REDIS_INSIGHT_PORT:-8001}:8001"
    volumes:
      - redis_data:/data
    networks:
      - agora-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-AgoraRedisSecret@Passw0rd!2026}' ping | grep PONG || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  agora-net:
    name: agora-net
